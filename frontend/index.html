<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Every day, a new mystery Wikipedia article to find. Make guesses, follow the shared links, fall down the Wikipedia rabbit hole, and track down the answer."
    />
    <meta property="og:title" content="Wikiddle - Daily Wikipedia Puzzle: Follow the Links, Find the Article" />
    <meta
      property="og:description"
      content="Every day, a new mystery Wikipedia article to find. Make guesses, follow the shared links, fall down the Wikipedia rabbit hole, and track down the answer."
    />
    <meta property="og:image" content="https://wikiddle.com/og_image.png" />
    <meta property="og:url" content="https://wikiddle.com" />
    <meta property="og:type" content="website" />
    <title>Wikiddle - Daily Wikipedia Puzzle: Follow the Links, Find the Article</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="known-links-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="known-categories-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>

    <div id="top-panel">
      <div id="title-area">
        <h1 id="site-title">
          <img src="wikiddle.svg" alt="Wikiddle" id="title-logo" />
        </h1>
        <button id="howto-btn"></button>
        <div id="lang-switcher">
          <a href="/en">EN</a>
          <a href="/fr">FR</a>
        </div>
      </div>
      <div id="input-area">
        <label for="guess-input" id="guess-input-label" class="visually-hidden"></label>
        <input type="text" id="guess-input" placeholder="" />
        <button id="guess-btn" class="btn btn-primary"></button>
        <button id="hint-btn" class="btn btn-secondary"></button>
      </div>
    </div>

    <aside id="yesterdays-banner">
      <div id="yesterdays-banner-text">
        <span id="yesterdays-banner-message"></span>
      </div>
      <button id="yesterdays-banner-dismiss" type="button">×</button>
    </aside>

    <div id="guesses-panel">
      <div id="guesses-list"></div>
    </div>

    <dialog id="win-overlay" class="overlay" aria-labelledby="win-message">
      <div id="win-box" class="overlay-box" role="dialog" aria-modal="true" aria-labelledby="win-message">
        <button id="win-close-btn" class="overlay-close-btn" type="button">×</button>
        <div id="win-message"></div>
        <div id="win-article"></div>
        <div id="win-game-stats"></div>
        <label id="win-share-label" for="win-share-preview"></label>
        <textarea id="win-share-preview" readonly rows="3"></textarea>
        <button id="win-share-btn" class="btn btn-primary"></button>
      </div>
    </dialog>

    <dialog id="howto-overlay" class="overlay" aria-labelledby="howto-title">
      <div id="howto-box" class="overlay-box"></div>
    </dialog>

    <dialog id="midnight-overlay" class="overlay" aria-labelledby="midnight-message">
      <div id="midnight-box" class="overlay-box" role="dialog" aria-modal="true" aria-labelledby="midnight-message">
        <p id="midnight-message"></p>
        <button id="midnight-btn" class="btn btn-primary"></button>
      </div>
    </dialog>

    <script type="module" src="app.js"></script>
  </body>
</html>
