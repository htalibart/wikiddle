<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wikiddle</title>
<link rel="stylesheet" href="style.css" />
<link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet">
</head>
<body>
<div id="top-panel">
  <h1>Wikiddle</h1>
  <div id="input-area">
    <input type="text" id="guess-input" placeholder="Guess an article..." />
    <button id="guess-btn">Guess</button>
    <button id="toggle-links-btn">Hide links</button>
  </div>
</div>
<div id="guesses-panel">
  <div id="guesses-list">
  </div>
</div>
<div id="win-overlay" style="display:none">
  <div id="win-box">
    <span id="win-close-btn">×</span>
    <p>You found the target article!</p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
<script src="app.js"></script>
</body>
</html>
